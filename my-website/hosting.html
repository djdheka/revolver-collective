<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guest List – Revolver Collective</title>
  <link rel="icon" href="favicon.ico?v=1" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=1">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=1">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=1">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #c9a84c;
      --black: #070707;
      --white: #f0ede6;
    }

    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Oswald', sans-serif;
      min-height: 100dvh;
    }

    /* ── NAV ── */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 9000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      height: 70px;
      background: rgba(7,7,7,0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(201,168,76,0.12);
    }
    .nav-logo { text-decoration: none; }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 36px;
      list-style: none;
    }
    .nav-logo-item { display: none; }
    .nav-links > li > a {
      font-family: 'Oswald', sans-serif;
      font-weight: 400;
      font-size: 13px;
      letter-spacing: 2px;
      color: rgba(240,237,230,0.5);
      text-decoration: none;
      text-transform: uppercase;
      transition: color 0.3s;
      white-space: nowrap;
    }
    .nav-links > li > a:hover { color: var(--gold); }

    /* ── PAGE HEADER ── */
    .page-header {
      padding: 120px 40px 60px;
      text-align: center;
      border-bottom: 1px solid rgba(201,168,76,0.1);
    }
    .page-header-label {
      font-size: 10px;
      letter-spacing: 6px;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .page-header-title {
      font-family: 'Anton', sans-serif;
      font-size: clamp(32px, 6vw, 60px);
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--white);
    }
    .page-header-rule {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 200px;
      margin: 24px auto 0;
    }
    .page-header-rule::before, .page-header-rule::after {
      content: '';
      flex: 1;
      height: 1px;
    }
    .page-header-rule::before { background: linear-gradient(to right, transparent, var(--gold)); }
    .page-header-rule::after  { background: linear-gradient(to left,  transparent, var(--gold)); }
    .page-header-rule-diamond {
      width: 5px; height: 5px;
      background: var(--gold);
      transform: rotate(45deg);
      margin: 0 10px;
      flex-shrink: 0;
    }

    /* ── WRAPPER ── */
    .hosting-wrapper {
      max-width: 1100px;
      margin: 0 auto;
      padding: 50px 40px 100px;
    }

    .status-msg {
      text-align: center;
      padding: 60px 20px;
      font-size: 11px;
      letter-spacing: 3px;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
    }
    .status-msg.error { color: rgba(255,120,120,0.6); }

    /* ── EVENT CARD ── */
    .guestlist-event {
      border: 1px solid var(--gold);
      margin-bottom: 40px;
    }

    .event-card-row {
      display: flex;
      align-items: stretch;
      gap: 0;
      padding: 32px;
    }

    .event-card-flyer {
      flex-shrink: 0;
      width: 220px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    .event-card-flyer img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 320px;
      object-fit: cover;
      border: 1px solid rgba(201,168,76,0.25);
      border-radius: 2px;
      cursor: pointer;
      transition: border-color 0.3s, opacity 0.3s;
    }
    .event-card-flyer img:hover { border-color: var(--gold); opacity: 0.9; }

    .event-card-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      margin-left: 28px;
      border: 1px solid rgba(201,168,76,0.2);
    }
    .event-card-name {
      font-family: 'Anton', sans-serif;
      font-size: clamp(20px, 3vw, 30px);
      letter-spacing: 3px;
      color: var(--gold);
      text-transform: uppercase;
      padding: 18px 24px;
      border-bottom: 1px solid rgba(201,168,76,0.15);
    }
    .event-card-desc {
      flex: 1;
      padding: 20px 24px;
      font-size: 11px;
      letter-spacing: 1.5px;
      line-height: 1.9;
      color: rgba(255,255,255,0.6);
      text-transform: uppercase;
      white-space: pre-line;
    }

    .event-card-venue {
      flex-shrink: 0;
      width: 260px;
      margin-left: 28px;
      border: 1px solid rgba(201,168,76,0.2);
      background: rgba(201,168,76,0.04);
      padding: 40px 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }
    .event-day {
      font-family: 'Anton', sans-serif;
      font-size: 80px;
      color: var(--gold);
      line-height: 1;
      letter-spacing: 2px;
    }
    .event-month-year {
      font-size: 11px;
      letter-spacing: 5px;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      margin-top: 6px;
    }
    .event-venue-info { margin-top: 32px; }
    .event-venue-label {
      font-size: 9px;
      letter-spacing: 4px;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .event-venue-name {
      font-size: 16px;
      letter-spacing: 2px;
      color: var(--white);
      text-transform: uppercase;
    }
    .event-venue-address {
      font-size: 10px;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      margin-top: 4px;
    }
    .event-directions {
      display: inline-block;
      margin-top: 10px;
      font-size: 8px;
      letter-spacing: 3px;
      color: var(--gold);
      text-transform: uppercase;
      text-decoration: none;
      border-bottom: 1px solid rgba(201,168,76,0.3);
      padding-bottom: 2px;
      transition: border-color 0.3s;
    }
    .event-directions:hover { border-color: var(--gold); }
    .event-time {
      margin-top: 32px;
      font-size: 10px;
      letter-spacing: 3px;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
    }
    .event-time span {
      display: block;
      font-size: 16px;
      letter-spacing: 2px;
      color: var(--white);
      margin-top: 4px;
    }
    .event-tag {
      display: inline-block;
      margin-top: 24px;
      font-size: 8px;
      letter-spacing: 3px;
      color: var(--gold);
      text-transform: uppercase;
      border: 1px solid rgba(201,168,76,0.35);
      padding: 5px 12px;
    }

    /* ── TOGGLE BAR ── */
    .guestlist-toggle {
      width: 100%;
      background: transparent;
      border: none;
      border-top: 1px solid rgba(201,168,76,0.2);
      color: var(--gold);
      font-family: 'Oswald', sans-serif;
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      padding: 16px 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.3s;
    }
    .guestlist-toggle:hover { background: rgba(201,168,76,0.05); }
    .guestlist-toggle .arrow { transition: transform 0.3s; display: inline-block; }
    .guestlist-toggle.open .arrow { transform: rotate(180deg); }

    /* ── HOST COLUMNS ── */
    .hosts-panel {
      display: none;
      border-top: 1px solid rgba(201,168,76,0.2);
      padding: 28px 32px 32px;
    }
    .hosts-panel.open { display: block; }
    .hosts-row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    .host-col {
      width: 180px;
      flex-shrink: 0;
      border: 1px solid rgba(201,168,76,0.25);
      display: flex;
      flex-direction: column;
    }
    .host-col.full { border-color: rgba(255,255,255,0.12); }
    .host-col-header {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(201,168,76,0.15);
      text-align: center;
    }
    .host-col-title {
      font-family: 'Anton', sans-serif;
      font-size: 15px;
      letter-spacing: 2px;
      color: var(--white);
      text-transform: uppercase;
    }
    .host-col-count {
      font-size: 10px;
      letter-spacing: 1.5px;
      color: var(--gold);
      margin-top: 4px;
    }
    .host-col-count.is-full { color: rgba(255,120,120,0.75); }
    .host-col-body {
      flex: 1;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .host-col-names {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .host-col-name-row {
      font-size: 10px;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.7);
      text-transform: uppercase;
      display: flex;
      align-items: baseline;
      gap: 6px;
      line-height: 1.5;
    }
    .host-col-name-row .dot {
      width: 3px; height: 3px;
      background: var(--gold);
      border-radius: 50%;
      flex-shrink: 0;
    }
    .host-col-join {
      margin-top: auto;
      font-family: 'Oswald', sans-serif;
      font-size: 9px;
      letter-spacing: 2.5px;
      color: var(--black);
      text-transform: uppercase;
      background: var(--gold);
      padding: 10px 0;
      border: none;
      cursor: pointer;
      transition: background 0.3s, color 0.3s;
    }
    .host-col-join:hover { background: var(--white); }
    .host-col-full-label {
      margin-top: auto;
      font-size: 9px;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.3);
      text-transform: uppercase;
      text-align: center;
    }

    /* join form (opens inline within the host column) */
    .host-form {
      display: none;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
      padding-top: 12px;
      border-top: 1px solid rgba(201,168,76,0.1);
    }
    .host-form.open { display: flex; }
    .host-form label {
      display: block;
      font-size: 8px;
      letter-spacing: 2px;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .host-form input, .host-form select {
      width: 100%;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(201,168,76,0.25);
      color: var(--white);
      font-family: 'Oswald', sans-serif;
      font-size: 11px;
      letter-spacing: 0.5px;
      padding: 8px 10px;
    }
    .host-form input:focus, .host-form select:focus {
      outline: none;
      border-color: var(--gold);
    }
    .host-form-extra-names {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .host-form-error {
      font-size: 9px;
      letter-spacing: 0.5px;
      color: rgba(255,120,120,0.8);
      text-transform: none;
      display: none;
      line-height: 1.5;
    }
    .host-form-error.show { display: block; }
    .host-form-success {
      font-size: 9px;
      letter-spacing: 1.5px;
      color: var(--gold);
      text-transform: uppercase;
      display: none;
      text-align: center;
    }
    .host-form-success.show { display: block; }
    .host-form-actions {
      display: flex;
      gap: 8px;
    }
    .host-form-submit {
      flex: 1;
      font-family: 'Oswald', sans-serif;
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--black);
      text-transform: uppercase;
      background: var(--gold);
      padding: 9px 0;
      border: none;
      cursor: pointer;
      transition: background 0.3s;
    }
    .host-form-submit:hover { background: var(--white); }
    .host-form-submit:disabled { opacity: 0.4; cursor: not-allowed; }
    .host-form-cancel {
      font-family: 'Oswald', sans-serif;
      font-size: 9px;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 9px 12px;
      cursor: pointer;
      transition: border-color 0.3s, color 0.3s;
    }
    .host-form-cancel:hover { color: var(--white); border-color: rgba(255,255,255,0.35); }

    /* ── NOTE ── */
    .hosting-note {
      margin-top: 20px;
      border-left: 2px solid var(--gold);
      padding: 16px 24px;
      background: rgba(201,168,76,0.03);
    }
    .hosting-note p {
      font-size: 11px;
      letter-spacing: 1px;
      line-height: 1.9;
      color: rgba(255,255,255,0.55);
      text-transform: none;
    }
    .hosting-note p + p { margin-top: 6px; }

    /* flyer lightbox */
    .flyer-lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20000;
      background: rgba(0,0,0,0.9);
      align-items: center;
      justify-content: center;
      padding: 40px;
      cursor: zoom-out;
      overflow: auto;
      touch-action: pinch-zoom;
    }
    .flyer-lightbox.active { display: flex; }
    .flyer-lightbox img {
      max-width: 100%;
      max-height: 100%;
      border: 1px solid rgba(201,168,76,0.3);
    }
    .flyer-lightbox-close {
      position: absolute;
      top: 24px; right: 32px;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--white);
      cursor: pointer;
    }
    .flyer-lightbox-close:hover { color: var(--gold); }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid rgba(201,168,76,0.1);
      text-align: center;
      padding: 32px 40px;
      font-size: 9px;
      letter-spacing: 4px;
      color: rgba(255,255,255,0.2);
      text-transform: uppercase;
    }

    /* Hamburger - hidden on desktop */
    .hamburger { display: none; }

    @media (max-width: 900px) {
      .event-card-row { flex-direction: column; padding: 20px; }
      .event-card-flyer { width: 100%; justify-content: center; }
      .event-card-flyer img { max-width: 220px; }
      .event-card-main { margin-left: 0; margin-top: 20px; }
      .event-card-venue { width: 100%; margin-left: 0; margin-top: 20px; }
      .hosts-panel { padding: 20px; }
    }

    @media (max-width: 800px) {
      .page-header { padding: 100px 24px 40px; }
      .hosting-wrapper { padding: 36px 20px 80px; }
      .nav { padding: 0 20px; }

      .hamburger {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 5px;
        z-index: 10000 !important;
        position: relative !important;
        width: 36px;
        height: 36px;
        cursor: pointer;
        background: none;
        border: none;
        padding: 0;
      }
      .hamburger span {
        display: block;
        width: 22px;
        height: 2px;
        background: var(--white);
        transition: all 0.3s ease;
      }
      .hamburger.open span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
      .hamburger.open span:nth-child(2) { opacity: 0; }
      .hamburger.open span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

      .nav-links {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(160deg, #0d0a00 0%, #1c1400 35%, #2b1e00 65%, #0d0a00 100%);
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
        z-index: 9999;
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s ease;
      }
      .nav-links.open { opacity: 1; pointer-events: all; }
      .nav-links > li { width: 100%; text-align: center; }
      .nav-links > li > a {
        font-size: 24px;
        letter-spacing: 6px;
        padding: 15px 0;
        display: block;
        color: #f0ede6;
        text-transform: uppercase;
        font-family: 'Anton', sans-serif;
        border-bottom: 1px solid rgba(201,168,76,0.15);
        transition: color 0.25s, letter-spacing 0.25s;
      }
      .nav-links > li.nav-logo-item { display: list-item; border: none !important; padding: 0 0 40px 0; }
      .nav-links > li.nav-logo-item img { height: 100px; opacity: 0.9; display: block; margin: 0 auto; }
      .nav-links > li:nth-child(2) > a { border-top: 1px solid rgba(201,168,76,0.15) !important; }
      .nav-links > li > a:hover { color: #c9a84c; letter-spacing: 8px; }
    }
  </style>
</head>

  <script>
    const SUPABASE_URL = 'https://bglpsruvpscbupltihzs.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJnbHBzcnV2cHNjYnVwbHRpaHpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MzkzMjgsImV4cCI6MjA5NzExNTMyOH0.C2d3XtZdE2XSoSKVIDnJU1OQng5tuv_e9Ld8i3vM53E';

    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

    let allHosts = {}; // keyed by event id -> array of host rows

    // Inserts Cloudinary transforms: f_auto,q_auto for format/quality, plus a width
    // cap so the full-resolution flyer isn't sent to a small preview thumb.
    function cdnUrl(url, width) {
      if (url && url.includes('res.cloudinary.com') && url.includes('/upload/')) {
        const transform = width ? `f_auto,q_auto,c_limit,w_${width}` : 'f_auto,q_auto';
        return url.replace('/upload/', `/upload/${transform}/`);
      }
      return url;
    }

    function openFlyerLightbox(url) {
      document.getElementById('flyer-lightbox-img').src = url;
      document.getElementById('flyer-lightbox').classList.add('active');
    }
    function closeFlyerLightbox() {
      document.getElementById('flyer-lightbox').classList.remove('active');
    }

    // Same "is this event over?" rule as the admin panel and upcoming-events page:
    // an event counts as past once it's 03:00 WIB the day AFTER the event date.
    function getNowInWIB() {
      const wibString = new Date().toLocaleString('en-US', { timeZone: 'Asia/Jakarta' });
      return new Date(wibString);
    }
    function isPastEvent(ev) {
      if (!ev.date) return false;
      const cutoff = new Date(ev.date + 'T00:00:00');
      cutoff.setDate(cutoff.getDate() + 1);
      cutoff.setHours(3, 0, 0, 0);
      return getNowInWIB() >= cutoff;
    }

    async function loadEvents() {
      const wrapper = document.getElementById('hosting-wrapper');
      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/events?guestlist_enabled=eq.true&order=date.asc`,
          { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }
        );
        const allEvents = await res.json();
        const events = allEvents.filter(ev => !isPastEvent(ev));

        if (!events.length) {
          wrapper.innerHTML = '<div class="status-msg">NO GUEST LIST OPEN RIGHT NOW</div>';
          return;
        }

        wrapper.innerHTML = events.map(ev => renderEventCard(ev)).join('');

        // Load hosts for every event in parallel
        await Promise.all(events.map(ev => loadHostsForEvent(ev.id)));

        events.forEach(ev => renderHostsPanel(ev));

      } catch (err) {
        console.error('Failed to load events:', err);
        wrapper.innerHTML = '<div class="status-msg error">FAILED TO LOAD EVENTS</div>';
      }
    }

    function renderEventCard(ev) {
      const d = ev.date ? new Date(ev.date) : null;
      const day = d ? d.getDate().toString().padStart(2,'0') : '';
      const monthYear = d ? `${MONTHS[d.getMonth()]} ${d.getFullYear()}` : '';
      const flyerHtml = ev.flyer_url
        ? `<img src="${cdnUrl(ev.flyer_url, 500)}" alt="${ev.name} flyer" onclick="openFlyerLightbox('${cdnUrl(ev.flyer_url, 1400)}')" />`
        : '';

      return `
        <div class="guestlist-event" id="event-${ev.id}">
          <div class="event-card-row">
            <div class="event-card-flyer">${flyerHtml}</div>
            <div class="event-card-main">
              <div class="event-card-name">${ev.name}</div>
              <div class="event-card-desc">${ev.description || ''}</div>
            </div>
            <div class="event-card-venue">
              <div>
                <div class="event-day">${day}</div>
                <div class="event-month-year">${monthYear}</div>
                <div class="event-venue-info">
                  <div class="event-venue-label">Venue</div>
                  <div class="event-venue-name">${ev.venue || ''}</div>
                  <div class="event-venue-address">${ev.city || ''}, Indonesia</div>
                  <a class="event-directions" href="https://maps.google.com/?q=${encodeURIComponent((ev.venue || '') + ' ' + (ev.city || ''))}" target="_blank" rel="noopener">↗ Get Directions</a>
                </div>
                <div class="event-time">Door Open<span>${ev.time || '21:00'} WIB</span></div>
                ${ev.tag ? `<span class="event-tag">${ev.tag}</span>` : ''}
              </div>
            </div>
          </div>
          <button class="guestlist-toggle" id="toggle-${ev.id}" onclick="toggleGuestList(${ev.id})">
            <span>Show Guest List</span><span class="arrow">▼</span>
          </button>
          <div class="hosts-panel" id="panel-${ev.id}">
            ${!ev.guestlist_capacity
              ? '<div class="status-msg error">GUEST LIST CAPACITY NOT SET YET — PLEASE CONTACT ADMIN</div>'
              : `<div class="hosts-row" id="hosts-row-${ev.id}"></div>`}
          </div>
        </div>`;
    }

    function toggleGuestList(eventId) {
      const panel = document.getElementById(`panel-${eventId}`);
      const btn = document.getElementById(`toggle-${eventId}`);
      panel.classList.toggle('open');
      btn.classList.toggle('open');
      btn.querySelector('span').textContent = panel.classList.contains('open') ? 'Hide Guest List' : 'Show Guest List';
    }

    async function loadHostsForEvent(eventId) {
      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/hosts?event_id=eq.${eventId}&order=host_number.asc,created_at.asc`,
          { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }
        );
        allHosts[eventId] = await res.json();
      } catch (err) {
        console.error('Failed to load hosts for event', eventId, err);
        allHosts[eventId] = [];
      }
    }

    function renderHostsPanel(ev) {
      const rowEl = document.getElementById(`hosts-row-${ev.id}`);
      if (!rowEl) return; // capacity not set, panel shows a message instead

      const capacity = ev.guestlist_capacity;
      const hosts = allHosts[ev.id] || [];

      const grouped = {};
      hosts.forEach(h => {
        if (!grouped[h.host_number]) grouped[h.host_number] = [];
        grouped[h.host_number].push(h);
      });

      const existingNumbers = Object.keys(grouped).map(Number);
      const maxExisting = existingNumbers.length ? Math.max(...existingNumbers) : 0;
      const hostsToShow = maxExisting + 1;

      let html = '';
      for (let n = 1; n <= hostsToShow; n++) {
        const entries = grouped[n] || [];
        const totalPeople = entries.reduce((sum, e) => sum + (e.total_people || 0), 0);
        const isFull = totalPeople >= capacity;
        const remaining = Math.max(0, capacity - totalPeople);

        const namesHtml = entries.map(e => {
          const allNames = [e.submitter_name, ...(e.other_names || [])];
          return `<div class="host-col-name-row"><span class="dot"></span>${allNames.join(', ')}</div>`;
        }).join('');

        html += `
          <div class="host-col ${isFull ? 'full' : ''}">
            <div class="host-col-header">
              <div class="host-col-title">Host ${n}</div>
              <div class="host-col-count ${isFull ? 'is-full' : ''}">${totalPeople}/${capacity}${isFull ? ' · FULL' : ''}</div>
            </div>
            <div class="host-col-body">
              <div class="host-col-names">${namesHtml}</div>
              ${isFull
                ? `<div class="host-col-full-label">Full</div>`
                : `<button class="host-col-join" onclick="toggleForm(${ev.id}, ${n})">+ Join</button>`}
              <div class="host-form" id="form-${ev.id}-${n}">
                <div>
                  <label>Name</label>
                  <input type="text" id="name-${ev.id}-${n}" placeholder="Your name" />
                </div>
                <div>
                  <label>How many person</label>
                  <select id="count-${ev.id}-${n}" onchange="renderExtraNames(${ev.id}, ${n})">
                    ${Array.from({length: remaining}, (_, i) => i + 1).map(i => `<option value="${i}">${i}</option>`).join('')}
                  </select>
                </div>
                <div class="host-form-extra-names" id="extra-names-${ev.id}-${n}"></div>
                <div class="host-form-error" id="error-${ev.id}-${n}"></div>
                <div class="host-form-success" id="success-${ev.id}-${n}">Joined!</div>
                <div class="host-form-actions">
                  <button class="host-form-submit" id="submit-${ev.id}-${n}" onclick="submitHost(${ev.id}, ${n}, ${remaining})">Submit</button>
                  <button class="host-form-cancel" onclick="toggleForm(${ev.id}, ${n})">✕</button>
                </div>
              </div>
            </div>
          </div>`;
      }

      rowEl.innerHTML = html;
    }

    function toggleForm(eventId, n) {
      const form = document.getElementById(`form-${eventId}-${n}`);
      const wasOpen = form.classList.contains('open');
      document.querySelectorAll('.host-form.open').forEach(f => f.classList.remove('open'));
      if (!wasOpen) {
        form.classList.add('open');
        renderExtraNames(eventId, n);
      }
    }

    function renderExtraNames(eventId, n) {
      const count = parseInt(document.getElementById(`count-${eventId}-${n}`).value, 10);
      const wrap = document.getElementById(`extra-names-${eventId}-${n}`);
      let html = '';
      for (let i = 2; i <= count; i++) {
        html += `<div><label>Person ${i}</label><input type="text" id="extra-${eventId}-${n}-${i}" placeholder="Name" /></div>`;
      }
      wrap.innerHTML = html;
    }

    async function submitHost(eventId, n, remaining) {
      const nameInput = document.getElementById(`name-${eventId}-${n}`);
      const countSelect = document.getElementById(`count-${eventId}-${n}`);
      const errorEl = document.getElementById(`error-${eventId}-${n}`);
      const successEl = document.getElementById(`success-${eventId}-${n}`);
      const submitBtn = document.getElementById(`submit-${eventId}-${n}`);

      const submitterName = nameInput.value.trim();
      const totalPeople = parseInt(countSelect.value, 10);

      errorEl.classList.remove('show');

      if (!submitterName) {
        errorEl.textContent = 'Please enter your name.';
        errorEl.classList.add('show');
        return;
      }
      if (totalPeople > remaining) {
        errorEl.textContent = `Only ${remaining} spot(s) left.`;
        errorEl.classList.add('show');
        return;
      }

      const otherNames = [];
      for (let i = 2; i <= totalPeople; i++) {
        const val = document.getElementById(`extra-${eventId}-${n}-${i}`).value.trim();
        if (!val) {
          errorEl.textContent = `Please enter the name of person ${i}.`;
          errorEl.classList.add('show');
          return;
        }
        otherNames.push(val);
      }

      submitBtn.disabled = true;
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/hosts`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=representation'
          },
          body: JSON.stringify({
            event_id: eventId,
            host_number: n,
            submitter_name: submitterName,
            total_people: totalPeople,
            other_names: otherNames,
            checked_in: false
          })
        });
        if (!res.ok) throw new Error('Insert failed');

        successEl.classList.add('show');
        await loadHostsForEvent(eventId);
        const evRes = await fetch(
          `${SUPABASE_URL}/rest/v1/events?id=eq.${eventId}&select=*`,
          { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }
        );
        const evRows = await evRes.json();
        if (evRows.length) {
          const wasOpen = document.getElementById(`panel-${eventId}`).classList.contains('open');
          renderHostsPanel(evRows[0]);
          if (wasOpen) {
            document.getElementById(`panel-${eventId}`).classList.add('open');
          }
        }
      } catch (err) {
        console.error('Failed to submit host:', err);
        errorEl.textContent = 'Something went wrong. Please try again.';
        errorEl.classList.add('show');
        submitBtn.disabled = false;
      }
    }

    loadEvents();
  </script>

  <script>
    function toggleMenu() {
      const nav = document.getElementById('nav-links');
      const btn = document.getElementById('hamburger');
      nav.classList.toggle('open');
      btn.classList.toggle('open');
    }
    document.querySelectorAll('.nav-links a').forEach(a => {
      a.addEventListener('click', () => {
        document.getElementById('nav-links').classList.remove('open');
        document.getElementById('hamburger').classList.remove('open');
      });
    });
  </script>
</body>
</html>
